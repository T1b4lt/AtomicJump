name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Usa el GITHUB_TOKEN del workflow (no caduca). La configuración está en
      # release-please-config.json y la versión actual en .release-please-manifest.json.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
